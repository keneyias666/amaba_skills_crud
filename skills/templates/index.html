{% extends 'base.html' %}
{% block content %}
	<form class="w3-card-4 w3-container w3-padding-8 w3-round-xlarge w3-animate-top" style="width:40%;margin:auto" method='post' action='/login'>
		<p>
			<label><b>E-MAIL</b></label>
			<input type="email" name="email" class="w3-input w3-border" />
		</p>
		<p>
			<label><b>PASSWORD</b></label>
			<input type="password" name="password" class="w3-input w3-border" />
		</p>
		<p class="w3-right">
			<input type="submit" value="LOGIN" class="w3-button w3-blue"/>
		</p>
	</form>
{% endblock %}
